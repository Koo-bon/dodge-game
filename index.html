<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>피하기</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0e1117;
    color: #e6e9ef;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic",
                 "Apple SD Gothic Neo", sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  #wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px;
  }
  #hud {
    display: flex;
    gap: 24px;
    font-variant-numeric: tabular-nums;
    font-size: 15px;
    color: #8b93a7;
  }
  #hud b { color: #e6e9ef; font-weight: 600; }
  #stage {
    position: relative;
    flex: 0 1 auto;
    max-width: 100%;
  }
  canvas {
    display: block;
    background: #151a23;
    border-radius: 12px;
    touch-action: none;
    cursor: none;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    background: rgba(14, 17, 23, .78);
    border-radius: 12px;
    padding: 20px;
  }
  #overlay.hide { display: none; }
  #title { font-size: 26px; font-weight: 700; }
  #sub { font-size: 15px; color: #8b93a7; line-height: 1.6; }
  #hint { font-size: 13px; color: #5b6478; margin-top: 6px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"><span>시간 <b id="score">0.0</b>초</span><span>최고 <b id="best">0.0</b>초</span></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="overlay">
      <div id="title">피하기</div>
      <div id="sub">떨어지는 블록을 피해서<br>최대한 오래 버티세요.</div>
      <div id="hint">클릭 또는 화면을 터치해서 시작</div>
    </div>
  </div>
</div>
<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const overlay = document.getElementById('overlay');
  const elTitle = document.getElementById('title');
  const elSub = document.getElementById('sub');
  const elHint = document.getElementById('hint');
  const elScore = document.getElementById('score');
  const elBest = document.getElementById('best');

  const R = 13;                 // 플레이어 반지름
  let W = 0, H = 0;             // 논리 크기(CSS px)
  let state = 'ready';          // ready | playing | over
  let px = 0, py = 0;           // 플레이어 위치
  let blocks = [], elapsed = 0, spawnTimer = 0, last = 0;
  // 시크릿 모드·일부 브라우저에서 localStorage 접근 자체가 예외를 던진다
  const store = {
    get() { try { return Number(localStorage.getItem('dodge.best')) || 0; } catch { return 0; } },
    set(v) { try { localStorage.setItem('dodge.best', String(v)); } catch {} }
  };
  let best = store.get();

  elBest.textContent = best.toFixed(1);

  function resize() {
    // 화면에 맞추되 세로로 긴 폰에서도 캔버스가 잘리지 않게
    W = Math.min(480, window.innerWidth - 32);
    H = Math.min(640, window.innerHeight - 100);
    const dpr = window.devicePixelRatio || 1;
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (state === 'playing') {          // 게임 중이면 현재 위치를 새 화면 안으로만 밀어넣는다
      px = clamp(px, R, W - R);
      py = clamp(py, R, H - R);
    } else {                            // 아니면 시작 위치로
      px = W / 2;
      py = H - 60;
    }
    if (state !== 'playing') draw();
  }
  const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;

  function start() {
    blocks = [];
    elapsed = 0;
    spawnTimer = 0;
    px = W / 2;
    py = H - 60;
    state = 'playing';
    overlay.classList.add('hide');
    last = performance.now();
    requestAnimationFrame(loop);
  }

  function gameOver() {
    state = 'over';
    if (elapsed > best) {
      best = elapsed;
      store.set(best);
      elBest.textContent = best.toFixed(1);
      elTitle.textContent = '최고 기록!';
    } else {
      elTitle.textContent = '게임 오버';
    }
    elSub.innerHTML = `${elapsed.toFixed(1)}초 버텼습니다<br>최고 ${best.toFixed(1)}초`;
    elHint.textContent = '클릭 또는 터치해서 다시 시작';
    overlay.classList.remove('hide');
  }

  // 시간이 지날수록 더 자주, 더 빠르게 — 60초에 최대 난이도
  const difficulty = t => Math.min(t / 60, 1);

  function spawn() {
    const d = difficulty(elapsed);
    const w = 16 + Math.random() * 30;
    blocks.push({
      x: Math.random() * (W - w),
      y: -30,
      w,
      h: 14 + Math.random() * 16,
      vy: 170 + Math.random() * 90 + d * 260
    });
  }

  function hit(b) {
    // 원 vs 사각형: 사각형에서 원 중심에 가장 가까운 점과의 거리
    const nx = clamp(px, b.x, b.x + b.w);
    const ny = clamp(py, b.y, b.y + b.h);
    const dx = px - nx, dy = py - ny;
    return dx * dx + dy * dy < R * R;
  }

  function loop(now) {
    if (state !== 'playing') return;
    const dt = Math.min((now - last) / 1000, 0.05); // 탭 전환 후 순간이동 방지
    last = now;
    elapsed += dt;

    const interval = 0.62 - difficulty(elapsed) * 0.42;
    spawnTimer += dt;
    while (spawnTimer >= interval) { spawnTimer -= interval; spawn(); }

    for (let i = blocks.length - 1; i >= 0; i--) {
      const b = blocks[i];
      b.y += b.vy * dt;
      if (b.y > H + 40) blocks.splice(i, 1);
      else if (hit(b)) { draw(); elScore.textContent = elapsed.toFixed(1); return gameOver(); }
    }

    elScore.textContent = elapsed.toFixed(1);
    draw();
    requestAnimationFrame(loop);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#ef4b6b';
    const rounded = typeof ctx.roundRect === 'function'; // 구형 사파리에는 없다
    for (const b of blocks) {
      if (rounded) { ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 3); ctx.fill(); }
      else ctx.fillRect(b.x, b.y, b.w, b.h);
    }
    ctx.fillStyle = state === 'over' ? '#6b7280' : '#4ade80';
    ctx.beginPath();
    ctx.arc(px, py, R, 0, Math.PI * 2);
    ctx.fill();
  }

  // 마우스와 터치를 한 번에 — pointer 이벤트
  cv.addEventListener('pointermove', e => {
    if (state !== 'playing') return;
    const r = cv.getBoundingClientRect();
    px = clamp(e.clientX - r.left, R, W - R);
    py = clamp(e.clientY - r.top, R, H - R);
  });
  cv.addEventListener('pointerdown', e => e.preventDefault());

  const press = () => { if (state !== 'playing') start(); };
  document.addEventListener('pointerdown', press);
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); press(); }
  });

  window.addEventListener('resize', resize);
  resize();
})();
</script>
</body>
</html>
