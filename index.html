<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>은행 주의보</title>
<style>
  /* 한글까지 지원하는 픽셀 폰트를 직접 담아 둔다 (외부 의존 없음) */
  @font-face {
    font-family: Galmuri; font-weight: 400; font-display: swap;
    src: url('fonts/Galmuri11.woff2') format('woff2');
  }
  @font-face {
    font-family: Galmuri; font-weight: 700; font-display: swap;
    src: url('fonts/Galmuri11-Bold.woff2') format('woff2');
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: #6fc3f0; }
  body {
    min-height: 100vh;
    background: #8ecbe8 url('assets/bg-title.png?v=6') center top / cover no-repeat fixed;
    color: #17263f;
    font-family: Galmuri, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-text-size-adjust: 100%;
  }
  body { display: flex; flex-direction: column; align-items: center; }
  img { image-rendering: pixelated; }

  /* 픽셀 게임 느낌: 둥근 모서리 없이 굵은 테두리와 딱 떨어지는 그림자 */
  .px { border: 4px solid #17263f; box-shadow: 6px 6px 0 rgba(23, 38, 63, .25); }

  /* ---------- 캐릭터 선택 ---------- */
  #select {
    width: 100%; max-width: 620px; margin: 22px 0 40px; padding: 26px 20px 30px;
    text-align: center;
    background: rgba(255, 253, 248, .93);
    border: 4px solid #17263f;
    box-shadow: 8px 8px 0 rgba(23, 38, 63, .28);
  }
  #select h1 {
    font-size: 44px; font-weight: 700; letter-spacing: 2px; color: #ffd84d;
    text-shadow: 3px 3px 0 #17263f, 7px 7px 0 rgba(23,38,63,.22);
  }
  #select .lead { margin-top: 16px; font-size: 14px; line-height: 2; }

  #carousel { margin-top: 26px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .arrow {
    background: none; border: none; cursor: pointer; padding: 6px;
    font: inherit; font-size: 28px; font-weight: 700; color: #17263f; line-height: 1;
    text-shadow: 2px 2px 0 rgba(255,255,255,.6);
  }
  .arrow:hover { color: #e8407a; }
  .side { width: 68px; height: 86px; display: flex; align-items: flex-end; justify-content: center; }
  .side img { height: 62px; width: 62px; opacity: .5; }

  #frame {
    width: 132px; height: 132px; background: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  #frame img { height: 124px; width: 124px; }

  #meta { margin-top: 18px; }
  #cname { font-size: 33px; font-weight: 700; text-shadow: 2px 2px 0 rgba(255,255,255,.7); }
  #cteam {
    display: inline-block; margin-top: 14px; font-size: 14px; font-weight: 700;
    background: #17263f; color: #ffe98f; padding: 7px 16px;
  }
  #cplace { margin-top: 14px; font-size: 18px; font-weight: 700; color: #b3306b; }
  #cconcept { margin-top: 10px; font-size: 16px; line-height: 1.9; color: #2b3d5c; }
  #cbest { margin-top: 14px; font-size: 14px; }

  #dots { margin-top: 16px; display: flex; gap: 7px; justify-content: center; }
  #dots i { width: 12px; height: 12px; background: rgba(23,38,63,.28); display: block; }
  #dots i.on { background: #17263f; }

  .btn {
    font: inherit; font-weight: 700; cursor: pointer;
    background: #ff4f8b; color: #fff;
    border: 4px solid #17263f; box-shadow: 5px 5px 0 rgba(23,38,63,.3);
    padding: 15px 34px; font-size: 22px; letter-spacing: 2px;
  }
  .btn:active { transform: translate(2px, 2px); box-shadow: 3px 3px 0 rgba(23,38,63,.3); }
  .btn.alt { background: #fff; color: #17263f; font-size: 12px; padding: 10px 16px; }
  #go { margin-top: 20px; }

  /* ---------- 게임 ---------- */
  #play { display: none; width: 100%; flex-direction: column; align-items: center; padding: 14px 12px 26px; }
  #play.on { display: flex; }
  #bar {
    width: 100%; max-width: 620px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: #fff; border: 4px solid #17263f; padding: 8px 10px; margin-bottom: 8px;
    font-size: 12px; font-weight: 700;
  }
  #bar .hp { color: #ff3355; letter-spacing: 2px; font-size: 14px; }
  #bar .sc { color: #b3306b; font-variant-numeric: tabular-nums; }
  #quit, #sound {
    font: inherit; font-weight: 700; font-size: 11px; cursor: pointer;
    background: #ffe98f; color: #17263f; border: 3px solid #17263f; padding: 5px 9px;
  }
  #sound.off { background: #e6e0d6; color: #8a8378; }
  #bar .hp.fev { color: #d98a00; }
  #stage { position: relative; }
  canvas {
    display: block; background: #cfeeff; border: 4px solid #17263f;
    touch-action: none; cursor: none; image-rendering: pixelated;
  }
  #over {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center; padding: 16px;
    background: rgba(23, 38, 63, .5);
  }
  #over.hide { display: none; }
  #over .panel {
    background: #fff; border: 4px solid #17263f; box-shadow: 6px 6px 0 rgba(23,38,63,.3);
    padding: 20px 18px; max-width: 100%;
    display: flex; flex-direction: column; align-items: center; gap: 9px; text-align: center;
  }
  #over .t { font-size: 22px; font-weight: 700; color: #b3306b; }
  #over .s { font-size: 12px; line-height: 1.9; font-weight: 700; }
  #over .h { font-size: 11px; line-height: 1.9; color: #4b5f80; }
  #over .btns { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; justify-content: center; }
  #tips { margin-top: 12px; font-size: 11px; line-height: 1.9; text-align: center; max-width: 620px; }
</style>
</head>
<body>

<section id="select">
  <h1>은행 주의보</h1>
  <p class="lead">떨어지는 은행과 낙엽을 피해<br>최대한 오래 버티기</p>

  <div id="carousel">
    <div class="side"><img id="prevImg" alt=""></div>
    <button id="prev" class="arrow" type="button" aria-label="이전 캐릭터">◀</button>
    <div id="frame" class="px"><img id="charImg" alt=""></div>
    <button id="next" class="arrow" type="button" aria-label="다음 캐릭터">▶</button>
    <div class="side"><img id="nextImg" alt=""></div>
  </div>

  <div id="meta">
    <div id="cname">—</div>
    <div id="cteam">—</div>
    <div id="cplace">—</div>
    <div id="cconcept">—</div>
    <div id="cbest">최고 0점</div>
  </div>

  <div id="dots"></div>
  <button id="go" class="btn" type="button">START</button>
</section>

<section id="play">
  <div id="bar">
    <span class="who" id="who">—</span>
    <span class="hp" id="hp">♥♥♥</span>
    <span class="sc"><span id="score">0</span>점</span>
    <button id="sound" type="button" title="배경음">♪ ON</button>
    <button id="quit" type="button">캐릭터 변경</button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="over">
      <div class="panel">
        <div class="t" id="overT">준비</div>
        <div class="s" id="overS"></div>
        <div class="h" id="overH"></div>
        <div class="btns">
          <button id="again" class="btn" type="button">시작</button>
          <button id="back" class="btn alt" type="button">캐릭터 변경</button>
        </div>
      </div>
    </div>
  </div>
  <p id="tips">마우스나 손가락을 좌우로 움직여 피하세요</p>
</section>

<script>window.ASSET_V = '6';</script>
<script src="bgm.js?v=6"></script>
<script src="chars.js?v=6"></script>
<script src="game.js?v=6"></script>
</body>
</html>
