<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가을 피하기</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    min-height: 100%;
    background: #16121c;
    color: #f2ecdf;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Malgun Gothic", "Segoe UI", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-text-size-adjust: 100%;
  }
  body { display: flex; flex-direction: column; align-items: center; }
  img { image-rendering: pixelated; }

  /* ---------- 캐릭터 선택 화면 ---------- */
  #select { width: 100%; max-width: 660px; padding: 28px 16px 40px; }
  #select h1 {
    font-size: 30px; letter-spacing: 2px; text-align: center;
    text-shadow: 3px 3px 0 #6b2d3c;
  }
  #select p.lead { text-align: center; color: #b3a692; font-size: 14px; margin-top: 10px; line-height: 1.7; }
  #grid {
    margin-top: 24px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  @media (max-width: 520px) { #grid { grid-template-columns: repeat(2, 1fr); } }
  .card {
    position: relative;
    background: #221b2b;
    border: 3px solid #40334f;
    padding: 0 0 10px;
    cursor: pointer;
    overflow: hidden;
    text-align: center;
  }
  .card:hover, .card:focus-visible { border-color: #e8b45c; outline: none; }
  .card .thumb {
    position: relative; height: 132px;
    background-size: cover; background-position: center;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .card .thumb img { height: 108px; width: auto; margin-bottom: -2px; }
  .card .nm { margin-top: 8px; font-size: 17px; font-weight: 700; }
  .card .pl { margin-top: 3px; font-size: 11px; color: #e8b45c; }
  .card .cc { margin-top: 5px; font-size: 11px; color: #9c8fa8; line-height: 1.5; padding: 0 8px; }
  .card .bs { margin-top: 7px; font-size: 11px; color: #6f6479; font-variant-numeric: tabular-nums; }

  /* ---------- 게임 화면 ---------- */
  #play { display: none; width: 100%; flex-direction: column; align-items: center; padding: 14px 12px 24px; }
  #play.on { display: flex; }
  #bar {
    width: 100%; max-width: 480px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 8px; font-size: 14px;
  }
  #bar .who { font-weight: 700; }
  #bar .sc { font-variant-numeric: tabular-nums; color: #e8b45c; font-weight: 700; }
  #bar .hp { letter-spacing: 2px; color: #ef4b6b; font-size: 16px; }
  #quit {
    background: none; border: 2px solid #40334f; color: #9c8fa8;
    font: inherit; font-size: 12px; padding: 4px 9px; cursor: pointer;
  }
  #quit:hover { border-color: #e8b45c; color: #f2ecdf; }
  #stage { position: relative; }
  canvas {
    display: block; background: #0f0c14;
    border: 3px solid #40334f;
    touch-action: none; cursor: none;
    image-rendering: pixelated;
  }
  #over {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; text-align: center; padding: 22px;
    background: rgba(22, 18, 28, .85);
  }
  #over.hide { display: none; }
  #over .t { font-size: 26px; font-weight: 700; text-shadow: 3px 3px 0 #6b2d3c; }
  #over .s { font-size: 15px; color: #d8ccb8; line-height: 1.8; }
  #over .h { font-size: 12px; color: #8d8196; margin-top: 4px; line-height: 1.7; }
  #over .btns { display: flex; gap: 10px; margin-top: 6px; }
  #over button {
    background: #e8b45c; color: #2a1d0f; border: none;
    font: inherit; font-weight: 700; font-size: 14px;
    padding: 10px 18px; cursor: pointer;
  }
  #over button.alt { background: none; color: #c8bcd4; border: 2px solid #4d3f5d; }
  #over button:hover { filter: brightness(1.08); }
  #tips { margin-top: 12px; font-size: 12px; color: #7b7086; text-align: center; line-height: 1.8; max-width: 480px; }
</style>
</head>
<body>

<section id="select">
  <h1>가을 피하기</h1>
  <p class="lead">
    은행 · 밤송이 · 낙엽 · 단풍은 피하고, 내 것들만 주워 먹기.<br>
    캐릭터를 고르면 배경과 주울 것들이 바뀝니다.
  </p>
  <div id="grid"></div>
</section>

<section id="play">
  <div id="bar">
    <span class="who" id="who">—</span>
    <span class="hp" id="hp">♥♥♥</span>
    <span class="sc"><span id="score">0</span>점</span>
    <button id="quit" type="button">캐릭터 변경</button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="over">
      <div class="t" id="overT">준비</div>
      <div class="s" id="overS"></div>
      <div class="h" id="overH"></div>
      <div class="btns">
        <button id="again" type="button">시작</button>
        <button id="back" class="alt" type="button">캐릭터 변경</button>
      </div>
    </div>
  </div>
  <p id="tips">마우스나 손가락을 움직여 캐릭터를 조종합니다.</p>
</section>

<script src="chars.js"></script>
<script src="game.js"></script>
</body>
</html>
