<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가을 피하기</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    min-height: 100%;
    background: #fff7f0;
    background-image:
      radial-gradient(circle at 12% 8%,  #ffe6cf 0, transparent 42%),
      radial-gradient(circle at 88% 4%,  #ffdfe8 0, transparent 38%),
      radial-gradient(circle at 50% 96%, #e6f4ff 0, transparent 46%);
    color: #5b4638;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Malgun Gothic", "Segoe UI", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-text-size-adjust: 100%;
  }
  body { display: flex; flex-direction: column; align-items: center; }
  img { image-rendering: pixelated; }

  /* ---------- 캐릭터 선택 화면 ---------- */
  #select { width: 100%; max-width: 680px; padding: 34px 16px 48px; }
  #select h1 {
    font-size: 32px; letter-spacing: 2px; text-align: center; color: #e8735f;
    text-shadow: 2px 2px 0 #fff, 4px 4px 0 #ffd9c2;
  }
  #select p.lead { text-align: center; color: #8d7566; font-size: 14px; margin-top: 12px; line-height: 1.8; }
  #grid {
    margin-top: 26px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  @media (max-width: 540px) { #grid { grid-template-columns: repeat(2, 1fr); } }
  .card {
    background: #fff;
    border: 3px solid #f3ddcd;
    border-radius: 14px;
    padding: 0 0 12px;
    cursor: pointer;
    overflow: hidden;
    text-align: center;
    transition: transform .12s, border-color .12s;
  }
  .card:hover, .card:focus-visible {
    border-color: #f2a07f; transform: translateY(-3px); outline: none;
  }
  .card .thumb {
    height: 130px;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .card .thumb img { height: 118px; width: auto; }
  .card .nm { margin-top: 10px; font-size: 18px; font-weight: 800; color: #4d3a2d; }
  .card .tm {
    display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 700;
    color: #7a6152; background: #fdeee2; border-radius: 20px; padding: 3px 10px;
  }
  .card .pl { margin-top: 7px; font-size: 11px; color: #d3805f; font-weight: 600; }
  .card .cc { margin-top: 5px; font-size: 11px; color: #96826f; line-height: 1.5; padding: 0 10px; }
  .card .bs { margin-top: 8px; font-size: 11px; color: #b6a596; font-variant-numeric: tabular-nums; }

  /* ---------- 게임 화면 ---------- */
  #play { display: none; width: 100%; flex-direction: column; align-items: center; padding: 16px 12px 28px; }
  #play.on { display: flex; }
  #bar {
    width: 100%; max-width: 480px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 10px; font-size: 14px;
    background: #fff; border: 3px solid #f3ddcd; border-radius: 12px; padding: 8px 12px;
  }
  #bar .who { font-weight: 800; color: #4d3a2d; }
  #bar .sc { font-variant-numeric: tabular-nums; color: #e8735f; font-weight: 800; }
  #bar .hp { letter-spacing: 2px; color: #ff7d95; font-size: 16px; }
  #quit {
    background: #fdeee2; border: 2px solid #f3ddcd; color: #7a6152; border-radius: 20px;
    font: inherit; font-size: 12px; font-weight: 700; padding: 4px 11px; cursor: pointer;
  }
  #quit:hover { border-color: #f2a07f; color: #4d3a2d; }
  #stage { position: relative; }
  canvas {
    display: block; background: #fdf3ea;
    border: 3px solid #f3ddcd; border-radius: 12px;
    touch-action: none; cursor: none;
    image-rendering: pixelated;
  }
  #over {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 18px;
    background: rgba(88, 68, 56, .34);
    border-radius: 12px;
  }
  #over .panel {
    background: #fffdfa;
    border: 3px solid #f3ddcd;
    border-radius: 18px;
    padding: 22px 22px 20px;
    max-width: 100%;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    text-align: center;
    box-shadow: 0 6px 0 rgba(140, 110, 90, .14);
  }
  #over.hide { display: none; }
  #over .t { font-size: 27px; font-weight: 800; color: #e8735f; text-shadow: 2px 2px 0 #fff; }
  #over .s { font-size: 15px; color: #5b4638; line-height: 1.8; font-weight: 600; }
  #over .h { font-size: 12px; color: #96826f; margin-top: 2px; line-height: 1.8; }
  #over .btns { display: flex; gap: 10px; margin-top: 6px; }
  #over button {
    background: #ff9a7b; color: #fff; border: none; border-radius: 22px;
    font: inherit; font-weight: 800; font-size: 14px;
    padding: 11px 20px; cursor: pointer;
  }
  #over button.alt { background: #fff; color: #7a6152; border: 2px solid #f3ddcd; }
  #over button:hover { filter: brightness(1.05); }
  #tips { margin-top: 14px; font-size: 12px; color: #a08d7c; text-align: center; line-height: 1.8; max-width: 480px; }
</style>
</head>
<body>

<section id="select">
  <h1>가을 피하기</h1>
  <p class="lead">
    은행 · 밤송이 · 낙엽 · 단풍은 피하고, 내 것들만 주워 먹기.<br>
    캐릭터를 고르면 배경과 주울 것들이 바뀝니다.
  </p>
  <div id="grid"></div>
</section>

<section id="play">
  <div id="bar">
    <span class="who" id="who">—</span>
    <span class="hp" id="hp">♥♥♥</span>
    <span class="sc"><span id="score">0</span>점</span>
    <button id="quit" type="button">캐릭터 변경</button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="over">
      <div class="panel">
        <div class="t" id="overT">준비</div>
        <div class="s" id="overS"></div>
        <div class="h" id="overH"></div>
        <div class="btns">
          <button id="again" type="button">시작</button>
          <button id="back" class="alt" type="button">캐릭터 변경</button>
        </div>
      </div>
    </div>
  </div>
  <p id="tips">마우스나 손가락을 움직여 캐릭터를 조종합니다.</p>
</section>

<script src="chars.js"></script>
<script src="game.js"></script>
</body>
</html>
